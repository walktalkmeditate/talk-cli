[workspace]
members = ["crates/talk-core"]

[package]
name = "talk"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "A terminal listening companion — speak a reflection, and it settles into a quiet file."
repository = "https://github.com/walktalkmeditate/talk-cli"
keywords = ["journaling", "voice", "reflection", "cli", "wellness"]
categories = ["command-line-utilities"]
exclude = ["/crates", "/web", "/demo", "/docs", "/tests", "/.github"]

[[bin]]
name = "talk"
path = "src/main.rs"

[features]
listen = ["download", "dep:cpal", "dep:sherpa-onnx", "dep:coreaudio-sys"]
download = ["dep:ureq"]
# formatter pulls in `download` so the verify-before-load machinery compiles
# whenever the formatter is enabled. NOTE: this opt-in feature's dep graph needs
# rustc >= 1.83 (zip via candle-core declares 1.83); the default/listen/download
# builds hold the package MSRV of 1.82 (verified with cargo +1.82).
formatter = ["download", "dep:candle-core", "dep:candle-transformers", "dep:tokenizers"]

[dependencies]
talk-core = { path = "crates/talk-core", version = "0.1.0" }
clap = { version = "=4.5.20", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
fs2 = "0.4"
crossterm = "0.28"
cpal = { version = "0.16", optional = true }          # match the sherpa-onnx rust-api-examples
sherpa-onnx = { version = "1.13", optional = true }   # verify symbols vs the pinned rust-api-examples
ureq = { version = "2", optional = true }             # v2: resp.into_reader() exists (removed in v3)
# candle-core and candle-transformers MUST share the same minor or Cargo links two
# incompatible candle-core copies (from_gguf then sees mismatched Content/Device types).
candle-core = { version = "0.9.2", optional = true }
candle-transformers = { version = "0.9.2", optional = true }
tokenizers = { version = "0.23.1", optional = true }  # Tokenizer::from_file (local-file load only)
sha2 = "0.10"
tar = "0.4"
bzip2 = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = { version = "=0.2.16", optional = true }   # MSRV pin, mirrors meditate-cli

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
