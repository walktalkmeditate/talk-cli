[package]
name = "talk-wasm"
version = "0.3.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "wasm-bindgen façade exposing the pure talk-core reflection engine to the browser."
repository = "https://github.com/walktalkmeditate/talk-cli"

[lib]
# cdylib for the wasm build; rlib so the native test suite can drive the façade.
crate-type = ["cdylib", "rlib"]

[dependencies]
talk-core = { path = "../talk-core" }
# Pinned: the wasm-bindgen library version must match the wasm-bindgen CLI used
# in web/scripts/build-wasm.sh, and stay within the 1.82 MSRV. Same pin meditate-wasm uses.
wasm-bindgen = "=0.2.95"
