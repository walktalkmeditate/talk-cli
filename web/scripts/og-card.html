<!doctype html>
<!--
  The Open Graph / social share card (1200×630), rendered to web/public/og.jpg by
  scripts/gen-og.mjs (a headless-chromium screenshot). Kept in-repo so the image is
  reproducible. Palette + font mirror the live terminal:
    bg #14100e · core rgb(210,146,118) · dim rgb(170,124,104) · edge rgb(150,122,112)
    fg #e6d5c8 · monospace (SF Mono first, matching terminal.ts).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        background: #14100e;
        color: #e6d5c8;
        font-family: "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
        padding: 86px 96px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .word { font-size: 104px; font-weight: 600; color: rgb(210, 146, 118); letter-spacing: 1px; line-height: 1; }
      .rule { color: rgb(150, 122, 112); font-size: 30px; letter-spacing: -3px; margin: 14px 0 30px; }
      .tag { font-size: 44px; color: #e6d5c8; margin-bottom: 34px; }
      .body { font-size: 32px; color: rgb(170, 124, 104); line-height: 1.55; }
      .foot { margin-top: 52px; font-size: 28px; color: rgb(150, 122, 112); }
      .dot { color: rgb(210, 146, 118); }
      .url { color: rgb(210, 146, 118); font-size: 30px; margin-top: 10px; }
    </style>
  </head>
  <body>
    <div class="word">talk</div>
    <div class="rule">────────────</div>
    <div class="tag">voice reflections &amp; journaling</div>
    <div class="body">
      speak a reflection or a journal entry —<br />
      it settles into a quiet local file.
    </div>
    <div class="foot"><span class="dot">●</span>&nbsp; local · nothing you say or write leaves your browser</div>
    <div class="url">talk.pilgrimapp.org</div>
  </body>
</html>
