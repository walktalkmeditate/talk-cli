<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>talk</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="Speak a reflection in your terminal. Free, on-device — after a one-time model download, nothing leaves your browser."
    />

    <!-- Open Graph / social share card -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="talk" />
    <meta property="og:url" content="https://talk.pilgrimapp.org/" />
    <meta property="og:title" content="talk — a reflection in your terminal" />
    <meta
      property="og:description"
      content="Speak a reflection in your terminal. Free, on-device — after a one-time model download, nothing leaves your browser."
    />
    <meta property="og:image" content="https://talk.pilgrimapp.org/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Warm rust text settling on a dark terminal — talk, talk.pilgrimapp.org"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="talk — a reflection in your terminal" />
    <meta
      name="twitter:description"
      content="Speak a reflection in your terminal. Free, on-device — nothing leaves your browser."
    />
    <meta name="twitter:image" content="https://talk.pilgrimapp.org/og.jpg" />

    <!-- Critical styles inline so the calm placeholder paints with zero JS,
         before the bundle or any font loads. No blank white flash. The rust
         palette: a dark warm ground, a warm off-white body, the rust accent. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #14100e;
        overflow: hidden;
        font-family: "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
        color: #e6d5c8;
      }
      #screen {
        position: absolute;
        inset: 0;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.1rem;
        transition: opacity 0.5s ease;
        pointer-events: none;
        color: rgb(210, 146, 118);
      }
      #loading.gone {
        opacity: 0;
      }
      #loading pre {
        margin: 0;
        font-size: 1.6rem;
        line-height: 1.05;
        opacity: 0.5;
      }
      #loading span {
        font-size: 0.78rem;
        letter-spacing: 0.28em;
        opacity: 0.6;
        text-transform: lowercase;
      }
    </style>
  </head>
  <body>
    <div id="screen"></div>
    <!-- The zero-JS loading placeholder: painted from inline CSS so the calm rust
         ground shows before main.ts boots. main.ts dismisses it once it mounts. -->
    <div id="loading" aria-hidden="true">
      <pre>talk</pre>
      <span>loading…</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
